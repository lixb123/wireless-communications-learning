  <g transform="translate(590,315)"><circle cx="0" cy="-85" r="28" fill="#ffd6c7" stroke="#f26b38" stroke-width="3"/><path d="M0 -56L0 30M0 -20L-55 15M0 -20L50 -5M0 30L-40 95M0 30L45 90" fill="none" stroke="#f26b38" stroke-width="8" stroke-linecap="round"/><text x="0" y="130" text-anchor="middle" class="l">运动人体</text></g>

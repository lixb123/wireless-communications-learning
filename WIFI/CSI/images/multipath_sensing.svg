<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="currentColor"/></marker><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173b57}.t{font-size:28px;font-weight:700}.l{font-size:19px}.n{font-size:16px;fill:#52697b}.wall{stroke:#8ba3b5;stroke-width:14}.direct{stroke:#0b84a5;stroke-width:5;fill:none;color:#0b84a5}.static{stroke:#7c4dff;stroke-width:4;fill:none;color:#7c4dff}.dynamic{stroke:#f26b38;stroke-width:5;fill:none;color:#f26b38;stroke-dasharray:12 7}</style></defs>
  <rect width="1100" height="600" fill="#fbfdff"/><text x="550" y="42" text-anchor="middle" class="t">室内多径如何把人体运动写入 CSI</text>

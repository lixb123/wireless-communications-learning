  <rect x="130" y="515" width="840" height="70" rx="12" fill="#edf3f7"/><text x="550" y="545" text-anchor="middle" class="l">φ̂[t,k] ≈ φchannel[t,k] + φcommon[t] + α[t]k + ε[t,k]</text><text x="550" y="572" text-anchor="middle" class="n">不同颜色只是概念分解；真实测量中各项并不会自动分开。</text>

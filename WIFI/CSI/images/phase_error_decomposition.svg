  <defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173b57}.t{font-size:28px;font-weight:700}.l{font-size:19px}.n{font-size:16px;fill:#52697b}.axis{stroke:#52697b;stroke-width:2}.true{stroke:#0b84a5;stroke-width:4;fill:none}.slope{stroke:#f26b38;stroke-width:4;fill:none}.meas{stroke:#7c4dff;stroke-width:5;fill:none}</style></defs>
  <rect width="1100" height="620" fill="#fbfdff"/><text x="550" y="42" text-anchor="middle" class="t">测量相位 = 信道结构 + 公共旋转 + 线性斜坡 + 噪声</text>
  <g transform="translate(75,100)"><line x1="0" y1="330" x2="930" y2="330" class="axis"/><line x1="0" y1="10" x2="0" y2="350" class="axis"/>
    <path d="M0 250 C90 220 150 275 240 235 C330 195 390 255 480 205 C570 165 650 210 735 170 C820 130 875 160 930 135" class="true"/>

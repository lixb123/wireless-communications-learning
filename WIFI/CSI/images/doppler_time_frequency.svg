<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600">
  <defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#173b57}.t{font-size:28px;font-weight:700}.l{font-size:18px}.n{font-size:16px;fill:#52697b}.axis{stroke:#52697b;stroke-width:2}.hot{fill:#f26b38}.mid{fill:#f7b267}.low{fill:#fce7c8}</style></defs>
  <rect width="1050" height="600" fill="#fbfdff"/><text x="525" y="42" text-anchor="middle" class="t">从动态相位到时间—Doppler 图（示意）</text>
  <g transform="translate(95,90)"><text x="180" y="0" text-anchor="middle" class="l">动态相位 φdyn(t)</text><line x1="0" y1="160" x2="360" y2="160" class="axis"/><line x1="0" y1="20" x2="0" y2="180" class="axis"/><path d="M0 145 C50 140,70 130,105 128 C140 125,145 45,180 35 C210 45,215 135,250 140 C300 145,330 145,360 145" fill="none" stroke="#0b84a5" stroke-width="5"/><text x="180" y="205" text-anchor="middle" class="l">时间 t</text><text x="-60" y="95" text-anchor="middle" class="l" transform="rotate(-90 -60 95)">相位</text><text x="180" y="235" text-anchor="middle" class="n">相位变化越快，|dφ/dt| 越大</text></g>
  <g transform="translate(555,90)"><text x="200" y="0" text-anchor="middle" class="l">STFT 后的有效 Doppler 能量</text><rect x="0" y="20" width="400" height="300" fill="#edf3f7" stroke="#52697b" stroke-width="2"/>
    <g opacity=".85"><ellipse cx="205" cy="145" rx="38" ry="115" class="low"/><ellipse cx="205" cy="145" rx="27" ry="82" class="mid"/><ellipse cx="205" cy="145" rx="15" ry="48" class="hot"/><ellipse cx="265" cy="160" rx="30" ry="70" class="low"/><ellipse cx="265" cy="160" rx="16" ry="38" class="mid"/></g>
    <line x1="0" y1="170" x2="400" y2="170" stroke="#8ba3b5" stroke-dasharray="7 6"/><text x="200" y="350" text-anchor="middle" class="l">时间 t</text><text x="-62" y="170" text-anchor="middle" class="l" transform="rotate(-90 -62 170)">有效 Doppler fD</text><text x="15" y="165" class="n">0</text><text x="200" y="382" text-anchor="middle" class="n">短时宽带能量可对应快速动作，但不是“跌倒定律”</text></g>
  <text x="525" y="555" text-anchor="middle" class="n">需先按真实时间戳重采样；多径几何未知时，频率峰值不能直接换算成精确人体速度。</text>
</svg>
